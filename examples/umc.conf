# /etc/umc/umc.conf - optional. Every setting has a sensible default; most
# defaults come from the host's own /etc/login.defs and /etc/default/useradd.
# The file must be owned by root and not writable by group/others. It is
# parsed, never executed. Unknown keys are an error (typos never go unnoticed).

# Naming policy for user and group names (bash regular expression, max length).
name_regex     = ^[a-z_][a-z0-9_.-]*[$]?$
name_max_len   = 32

# Where new homes go, and where 'umc user delete' may remove them (space separated).
home_base      = /home
home_roots     = /home /srv/home

default_shell  = /bin/bash
# default_groups = staff

# Accounts that can never be locked, offboarded or deleted (break-glass accounts).
protected_users = breakglass,ops-oncall

# Groups removed when someone is offboarded.
privileged_groups = sudo wheel adm docker lxd libvirt

# Journal retention: keep at least this many transactions, and any younger than N days.
txn_keep_count = 100
txn_keep_days  = 90

# Leavers: how long an offboarded account is kept before deletion is suggested.
offboard_retention_days = 30
archive_home_on_offboard = yes

# Joiners: hours to change a generated temporary password; where slips are written.
onboarding_deadline_hours = 24
credentials_dir = /root/umc/credentials

# How user names are derived when an import has none: first.last flast firstl first_last last.first first
username_pattern = first.last

# Never hand a deleted account's UID/GID to a new account.
reuse_ids = no

lock_timeout = 15

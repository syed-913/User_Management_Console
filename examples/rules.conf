# /etc/umc/rules.conf - "birthright access": turn HR attributes into Linux access.
# attribute=pattern -> action     (patterns are case-insensitive globs)
# attributes: department title location email external_id username
# actions:    role=NAME  groups=a,b  shell=PATH  sudo=none|full|nopasswd
department=engineering       -> role=dev
department=it operations     -> role=admin
title=*contractor*           -> role=contractor
title=*manager*              -> groups=managers
location=karachi*            -> groups=site-khi
